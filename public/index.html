  <!-- "Add to Home Screen" on iOS looks only for apple-touch-icon, never the regular favicon
       above. apple-touch-icon.png is generated at Apple's 180x180 with the logo padded on a solid
       cream square: iOS renders transparent pixels as black, so the icon must not have any. -->
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Kasafide" />

  <link rel="stylesheet" href="assets/css/kasafide-theme.css" />
    <title>Kasafide</title>
  <meta name="description" content="Kasafide is a verified housing rental and listing platform for Sta. Maria, Bulacan. Every seller is ID-checked and every listing is reviewed before it goes live." />

    <!-- React (via CDN — no build tools needed).

<!-- The landing page reads the database for its figures, so it needs the same chain every other
     page uses: supabase-js, then config.js for `sb`, then data.js for `HS`.
     session.js only redirects on /module/ pages, so it is inert here — but data.js expects the
     helpers it defines. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.js"></script>
<script src="assets/js/config.js?v=2"></script>
