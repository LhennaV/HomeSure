<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="../../assets/img/image.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HomeSure – My Payments</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/buyer/buyer-payments.css" />
  <link rel="stylesheet" href="../../assets/css/payment-modal.css" />
  <link rel="stylesheet" href="../../assets/css/property-selector-modal.css" />
  <link rel="stylesheet" href="../../assets/css/responsive.css" />
  <style>
    /* Force hide old payment modal and any stray elements */
    #payModal,
    #payStep0,
    #payStep1a,
    #payStep1b,
    #payStep2 {
      display: none !important;
    }
  </style>
</head>
<body>
<div class="layout">
  <div id="hs-sidebar"></div>
  <div class="main">
    <div id="hs-topbar"></div>
    <div class="content">

      <!-- Page Header -->
      <div class="page-header">
        <div>
          <div class="page-title">My Payments</div>
          <div class="page-sub">Track rent payments, view history, and manage your security deposit</div>
        </div>
        <button class="btn-primary" onclick="payNowWithQRPH()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          Pay Now
        </button>
      </div>

      <!-- Stat Cards -->
      <div class="stat-row" id="statRow">
        <!-- injected by JS -->
      </div>

      <!-- Tab Bar -->
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="upcoming" onclick="switchTab('upcoming')">Upcoming</button>
        <button class="tab-btn" data-tab="history" onclick="switchTab('history')">History</button>
        <button class="tab-btn" data-tab="deposit" onclick="switchTab('deposit')">Deposit</button>
      </div>

      <!-- Tab: Upcoming -->
      <div class="tab-content" id="tab-upcoming">
        <div id="upcomingContainer"></div>
      </div>

      <!-- Tab: History -->
      <div class="tab-content" id="tab-history" style="display:none">
        <div class="table-toolbar">
          <input class="search-input" id="historySearch" type="text" placeholder="Search by reference, period, or method…" />
        </div>
        <div id="historyContainer"></div>
      </div>

      <!-- Tab: Deposit -->
      <div class="tab-content" id="tab-deposit" style="display:none">
        <div id="depositContainer"></div>
      </div>

    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <span class="toast-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  </span>
  <span id="toastMsg"></span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.js"></script>
<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/session.js"></script>
<script src="../../assets/js/data.js"></script>
<script src="../../components/sidebar.js"></script>
<script src="../../components/topbar.js"></script>
<script src="../../assets/js/payment-integration.js"></script>
<script src="../../assets/js/buyer/buyer-payments.js"></script>

<script>
  // Clean up any stray modal elements on page load
  window.addEventListener('DOMContentLoaded', function() {
    // Remove old payment modal if it exists
    const oldModal = document.getElementById('payModal');
    if (oldModal) {
      oldModal.remove();
      console.log('✅ Removed old payment modal');
    }

    // Hide any orphaned modal backdrops
    document.querySelectorAll('.modal-backdrop').forEach(el => {
      if (!el.closest('#paymentModalBackdrop')) {
        el.style.display = 'none';
        console.log('✅ Hidden stray modal backdrop');
      }
    });
  });
</script>
</body>
</html>
