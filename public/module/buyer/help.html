<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="../../assets/img/image.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HomeSure – Help & Support</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- buyer.css itself says "Requires: dashboard.css" — this page never actually linked it, so
       every CSS variable it and the <style> block below reference (--text, --muted2, --card…)
       and the base body font-family were all undefined. That's why this page fell back to the
       browser's default serif font and unstyled colors while the sidebar (its own component,
       self-contained) looked fine. buyer-dashboard.css carries the same tokens buyer.html itself
       uses, so this page now matches it instead of the more minimal plain dashboard.css. -->
  <link rel="stylesheet" href="../../assets/css/buyer/buyer-dashboard.css" />
  <link rel="stylesheet" href="../../assets/css/buyer/buyer.css" />
  <link rel="stylesheet" href="../../assets/css/chatbot-widget.css" />
  <link rel="stylesheet" href="../../assets/css/responsive.css" />
  <style>
    /* Override widget styles for full-page mode */
    body, html {
      height: 100vh;
      overflow: hidden;
    }

    .layout {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    .chatbot-bubble {
      display: none !important;
    }

    .help-container {
      flex: 1;
      padding: 26px 30px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .page-header {
      margin-bottom: 24px;
      flex-shrink: 0;
    }

    .page-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
    }

    .page-sub {
      font-size: 13px;
      color: var(--muted2);
    }

    .chatbot-window {
      position: static !important;
      width: 100% !important;
      height: auto !important;
      flex: 1;
      min-height: 0;
      border-radius: 16px !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1) !important;
      display: flex !important;
      flex-direction: column;
      background: var(--card);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .chatbot-header {
      flex-shrink: 0;
      background: linear-gradient(135deg, #00c9a7 0%, #0F766E 100%);
      padding: 20px 24px;
      border-bottom: none;
    }

    .chatbot-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      /* Was 20% opacity, same issue as chatbot-widget.css's copy of this rule and the same fix:
         a teal-gradient logo on a teal header needs real contrast to actually read as an icon. This
         page redefines .chatbot-avatar locally (it loads after chatbot-widget.css), so fixing it
         there alone was not enough — this copy was the one actually winning here. */
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
    }

    .chatbot-avatar svg,
    .chatbot-avatar img {
      width: 36px;
      height: 36px;
      color: #fff;
      display: block;
    }

    .chatbot-header-info {
      flex: 1;
    }

    .chatbot-header-title {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }

    .chatbot-header-status {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chatbot-status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .chatbot-messages {
      flex: 1 !important;
      min-height: 0 !important;
      overflow-y: auto !important;
      padding: 24px;
      background: var(--bg);
    }

    .chatbot-messages::-webkit-scrollbar {
      width: 6px;
    }

    .chatbot-messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .chatbot-messages::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 99px;
    }

    .chatbot-messages::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }

    /* Message bubbles */
    .chat-message {
      margin-bottom: 16px;
      display: flex;
      gap: 12px;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .chat-message.bot .message-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00c9a7, #0F766E);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .chat-message.bot .message-avatar svg {
      width: 16px;
      height: 16px;
      color: #fff;
    }

    .chat-message.bot .message-bubble {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      border-top-left-radius: 4px;
      padding: 14px 18px;
      max-width: 70%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .chat-message.user {
      justify-content: flex-end;
    }

    .chat-message.user .message-bubble {
      background: linear-gradient(135deg, #00c9a7, #0F766E);
      color: #fff;
      border-radius: 16px;
      border-top-right-radius: 4px;
      padding: 14px 18px;
      max-width: 70%;
      box-shadow: 0 2px 12px rgba(0, 201, 167, 0.3);
    }

    .message-text {
      font-size: 13.5px;
      line-height: 1.6;
      margin-bottom: 8px;
    }

    .message-text:last-child {
      margin-bottom: 0;
    }

    .quick-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .quick-action-btn {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .quick-action-btn:hover {
      background: var(--teal);
      border-color: var(--teal);
      color: #fff;
      transform: translateY(-1px);
    }

    .chatbot-input-area {
      flex-shrink: 0;
      padding: 20px;
      background: var(--card);
      border-top: 1px solid var(--border);
    }

    .chatbot-input-wrap {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .chatbot-input {
      flex: 1;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 13.5px;
      color: var(--text);
      font-family: inherit;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
      max-height: 120px;
    }

    .chatbot-input:focus {
      border-color: var(--teal);
    }

    .chatbot-input::placeholder {
      color: var(--muted);
    }

    .chatbot-send-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #00c9a7, #0F766E);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .chatbot-send-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 201, 167, 0.4);
    }

    .chatbot-send-btn:active {
      transform: translateY(0);
    }

    .chatbot-send-btn svg {
      width: 20px;
      height: 20px;
      color: #fff;
    }

    /* This whole block above was written for desktop only — no media query existed at all, so on
       a phone the sidebar's mobile bottom nav (.hs-bottom-nav, fixed, 62px tall, see sidebar.js)
       sat on top of the chat input instead of the page leaving room for it. .help-container locks
       to height:100vh with no bottom clearance, so that 62px has to come out of it directly. */
    @media (max-width: 768px) {
      .help-container {
        padding: 16px 14px;
        padding-bottom: calc(62px + env(safe-area-inset-bottom, 0px));
      }
      .page-header { margin-bottom: 14px; }
      .page-title { font-size: 19px; }
      .page-sub { font-size: 12px; }
      .chatbot-header { padding: 14px 16px; }
      .chatbot-avatar { width: 46px; height: 46px; }
      .chatbot-avatar svg, .chatbot-avatar img { width: 38px; height: 38px; }
      .chatbot-header-title { font-size: 15px; }
      .chatbot-messages { padding: 16px; }
      /* .chat-message/.message-bubble below (and throughout the block above) don't match what
         chatbot-widget.js actually renders — it outputs .chatbot-message/.chatbot-message-bubble.
         Both are targeted here since the real one is what matters; the other was already dead CSS
         before this edit and this doesn't fix that pre-existing mismatch, just doesn't repeat it. */
      .chat-message .message-bubble,
      .chatbot-message-bubble { max-width: 85%; }
      .chatbot-input-area { padding: 12px; }
      .quick-actions { gap: 6px; }
      .quick-action-btn { padding: 6px 12px; font-size: 11.5px; }
    }
  </style>
</head>
<body>
<div class="layout">
  <div id="hs-sidebar"></div>
  <div class="main">
    <div id="hs-topbar"></div>

    <div class="help-container">
      <div class="page-header">
        <div class="page-title">Help & Support</div>
        <div class="page-sub">Get instant help from our AI assistant or connect with support</div>
      </div>

      <!-- Chat Window (Full Page) -->
      <div class="chatbot-window open" id="chatbotWindow">
        <div class="chatbot-header">
          <div class="chatbot-avatar">
            <img src="../../assets/img/homesure-cat.svg" alt="Meowrie" />
          </div>
          <div class="chatbot-header-info">
            <div class="chatbot-header-title">Meowrie</div>
            <div class="chatbot-header-status">
              <span class="chatbot-status-dot"></span>
              Online - Always here to help
            </div>
          </div>
        </div>

        <div class="chatbot-messages" id="chatbotMessages"></div>

        <div class="chatbot-input-area">
          <div class="chatbot-input-wrap">
            <textarea
              class="chatbot-input"
              id="chatbotInput"
              placeholder="Type your message..."
              rows="1"
              onkeydown="ChatbotWidget.handleKeyDown(event)"
            ></textarea>
            <button class="chatbot-send-btn" id="chatbotSendBtn" onclick="ChatbotWidget.sendMessage()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.js"></script>
<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/session.js"></script>
<script src="../../assets/js/data.js"></script>
<script src="../../components/sidebar.js"></script>
<script src="../../components/topbar.js"></script>
<script src="../../assets/js/chatbot-widget.js"></script>
<script>
  // Initialize sidebar
  HomeSureSidebar.init({ activePage: 'help' });
  HomeSureTopbar.init({ placeholder: 'Search help articles...' });

  // Initialize chatbot (full-page mode)
  ChatbotWidget.initFullPage();
</script>
</body>
</html>
