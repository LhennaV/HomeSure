<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="../../assets/img/kasafide-favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/img/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../../assets/img/favicon-16.png" />
  <link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png" />
  <link rel="manifest" href="../../site.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="../../assets/js/kasafide-theme.js"></script>
  <script src="../../assets/js/kasafide-logo.js"></script>
  <link rel="stylesheet" href="../../assets/css/kasafide-theme.css" />
  <title>Kasafide – Messages</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/buyer/buyer-messages.css" />
  <link rel="stylesheet" href="../../assets/css/payment-modal.css" />
  <link rel="stylesheet" href="../../assets/css/responsive.css" />
</head>
<body>
<div class="layout">
  <div id="hs-sidebar"></div>
  <div class="main">
    <div id="hs-topbar"></div>
    <div class="content">
      <div class="messages-layout">

        <!-- ── Conversation list ── -->
        <div class="conv-panel">
          <div class="conv-top">
            <div class="conv-title">Messages</div>
            <div class="conv-search-wrap">
              <span class="conv-search-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              </span>
              <input class="conv-search" id="convSearch" placeholder="Search conversations..." oninput="filterConvsSoon()" />
            </div>
          </div>
          <div class="conv-list" id="convList">
            <!-- Conversations will be loaded by JavaScript -->
          </div>
        </div>

        <!-- ── Chat area ── -->
        <!-- Filled in by buyer-messages.js once a conversation is opened. Until then this is
             the same empty state the script shows, so no placeholder conversation is ever on screen. -->
        <div class="chat-panel" id="chatPanel">
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:40px;text-align:center;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="64" height="64" style="opacity:0.3;margin-bottom:20px;">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            <h3 style="font-size:18px;font-weight:700;color:var(--text);margin-bottom:8px;">Loading your messages…</h3>
            <p style="font-size:13px;color:var(--muted);max-width:300px;">Select a conversation from the list to view messages</p>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════════════════════════════
     OLD PAYMENT MODAL - DISABLED (Now using QRPH)
     ══════════════════════════════════════════════════════════════════════════════
────────────────────────────────────────────────────────────────────────────── -->

<style>
  .chat-method-card {
    background: var(--surface-soft); border: 2px solid rgb(var(--wash-rgb) / 0.07);
    border-radius: 12px; padding: 14px 12px; cursor: pointer;
    text-align: left; display: flex; flex-direction: column;
    font-family: inherit; color: var(--text);
    transition: border-color .18s, background .18s, transform .14s;
  }
  .chat-method-card:hover { border-color: rgb(var(--wash-rgb) / 0.18); transform: translateY(-2px); }
  .chat-method-card.selected {
    border-color: var(--primary) !important;
    background: rgb(var(--primary-rgb) / 0.15) !important;
    box-shadow: 0 ;
    transform: scale(1.02);
  }
  #chatNextBtn:not([disabled]) { opacity: 1; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Custom Notification Toast */
  .custom-notif {
    position: fixed;
    top: 20px;
    right: 20px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary) 100%);
    color: var(--on-primary);
    padding: 16px 20px;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgb(var(--primary-rgb) / 0.4), 0 2px 8px rgb(var(--shade-rgb) / min(0.2, var(--shadow-cap, 1)));
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    z-index: 9999;
    min-width: 300px;
    animation: slideInRight 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  }
  .custom-notif.hiding {
    animation: slideOutRight 0.3s ease-in forwards;
  }
  .custom-notif-icon {
    width: 24px;
    height: 24px;
    background: rgb(var(--wash-rgb) / 0.25);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  @keyframes slideInRight {
    from {
      transform: translateX(400px);
      opacity: 0;
    }
    to {
      transform: translateX(0);
      opacity: 1;
    }
  }
  @keyframes slideOutRight {
    from {
      transform: translateX(0);
      opacity: 1;
    }
    to {
      transform: translateX(400px);
      opacity: 0;
    }
  }
</style>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.js"></script>
<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/session.js"></script>
<script src="../../assets/js/data.js"></script>

<script src="../../components/topbar.js"></script>

<!-- Mobile Navigation Fix: Show conversation list when Messages nav clicked -->
<script>
  // On page load, ensure conversation list is visible on mobile
  window.addEventListener('DOMContentLoaded', () => {
    // Close any open chat on mobile when page loads
    if (window.innerWidth <= 768) {
      window.closeMobileChat();
    }

    // Listen for Messages nav item clicks (especially on mobile)
    document.addEventListener('click', (e) => {
      const navItem = e.target.closest('[data-page="messages"]');
      if (navItem && window.innerWidth <= 768) {
        // Close chat to show conversation list
        setTimeout(() => {
          window.closeMobileChat();
        }, 100);
      }
    });
  });

  // Handle window resize
  window.addEventListener('resize', () => {
    if (window.innerWidth <= 768) {
      // If resizing to mobile, close chat
      const messagesLayout = document.querySelector('.messages-layout');
      if (messagesLayout && messagesLayout.classList.contains('chat-open')) {
        window.closeMobileChat();
      }
    }
  });
</script>
</body>
</html>
