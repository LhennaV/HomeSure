<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="../../assets/img/image.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>HomeSure – Meowrie</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/seller/seller-dashboard.css" />
  <link rel="stylesheet" href="../../assets/css/chatbot-widget.css" />
  <script>
    // seller-dashboard.css keys its dark/light tokens off [data-theme] on <html>. Normally
    // sidebar.js's init() sets that as a side effect of building the sidebar — this page
    // deliberately renders neither the sidebar nor the topbar (see the redesign note below), so
    // that side effect never happens unless done here directly, and done before first paint so
    // there's no flash of the wrong theme.
    document.documentElement.setAttribute('data-theme', localStorage.getItem('hs-theme') || 'dark');
  </script>
  <style>
    /* ═══════════════════════════════════════════════════════════════════════
       Same redesign as buyer/help.html — see that file for the full reasoning.
       Short version: this used to be the dashboard's sidebar + topbar (a
       non-functional search bar — HomeSureTopbar.init() was never given an
       onSearch handler) wrapped around a second, separately-boxed chat card,
       on top of the mobile bottom tab bar. Replaced with the iOS pattern:
       one nav bar, full-bleed thread, no tab bar competing with the input
       bar for the bottom safe area.
       ═══════════════════════════════════════════════════════════════════════ */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .help-screen {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    /* ── iOS-style nav bar ── */
    .ios-navbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: calc(10px + env(safe-area-inset-top, 0px)) 8px 10px;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .ios-back-btn {
      display: flex;
      align-items: center;
      gap: 2px;
      background: none;
      border: none;
      color: var(--teal);
      font-size: 15px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      padding: 6px 8px 6px 2px;
      flex: 0 0 auto;
      min-width: 90px;
    }
    .ios-back-btn svg { width: 22px; height: 22px; flex-shrink: 0; }

    .ios-navbar-identity {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      min-width: 0;
    }

    .ios-navbar-avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00c9a7, #0F766E);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 2px;
      overflow: hidden;
    }
    .ios-navbar-avatar img { width: 24px; height: 24px; display: block; }

    .ios-navbar-name { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.2; }
    .ios-navbar-status {
      font-size: 11px; color: var(--muted2);
      display: flex; align-items: center; gap: 4px;
    }
    .ios-navbar-status .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #30d158;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

    .ios-navbar-spacer { flex: 0 0 auto; min-width: 90px; }

    /* ── Message thread — full-bleed, no boxed card ── */
    .chatbot-messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 14px 14px calc(10px + env(safe-area-inset-bottom, 0px));
      background: var(--bg);
    }
    .chatbot-messages::-webkit-scrollbar { width: 5px; }
    .chatbot-messages::-webkit-scrollbar-track { background: transparent; }
    .chatbot-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    .chatbot-quick-actions { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 10px; }
    .chatbot-quick-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--teal);
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, transform 0.1s;
    }
    .chatbot-quick-btn:active { transform: scale(0.96); }
    .chatbot-quick-btn:hover { background: var(--teal-faint, rgba(0,201,167,0.12)); }

    /* ── iOS Messages-style input bar ── */
    .ios-input-bar {
      flex-shrink: 0;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      backdrop-filter: blur(20px) saturate(180%);
      border-top: 1px solid var(--border);
    }

    .ios-input {
      flex: 1;
      min-height: 36px;
      max-height: 110px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 14.5px;
      font-family: inherit;
      color: var(--text);
      resize: none;
      outline: none;
      transition: border-color 0.2s;
    }
    .ios-input:focus { border-color: var(--teal); }
    .ios-input::placeholder { color: var(--muted); }

    .ios-send-btn {
      flex-shrink: 0;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--teal);
      border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: transform 0.12s, opacity 0.15s;
    }
    .ios-send-btn:active { transform: scale(0.9); }
    .ios-send-btn svg { width: 17px; height: 17px; color: #fff; }

    /* ── Message bubbles (kept — already close to iMessage) ── */
    .chatbot-message { margin-bottom: 10px; display: flex; animation: slideUp 0.25s ease; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .chatbot-message.bot { justify-content: flex-start; }
    .chatbot-message.user { justify-content: flex-end; }

    .chatbot-message-bubble {
      max-width: 78%;
      padding: 10px 14px;
      font-size: 14.5px;
      line-height: 1.45;
      border-radius: 18px;
    }
    .chatbot-message.bot .chatbot-message-bubble {
      background: var(--card);
      color: var(--text);
      border-bottom-left-radius: 5px;
    }
    .chatbot-message.user .chatbot-message-bubble {
      background: var(--teal);
      color: #fff;
      border-bottom-right-radius: 5px;
    }

    .chatbot-typing { display: flex; margin-bottom: 10px; }
    .chatbot-typing .chatbot-message-bubble {
      background: var(--card); border-bottom-left-radius: 5px;
      display: flex; gap: 4px; padding: 13px 16px;
    }
    .chatbot-typing-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--muted2);
      animation: typingBounce 1.2s infinite;
    }
    .chatbot-typing-dot:nth-child(2) { animation-delay: 0.15s; }
    .chatbot-typing-dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes typingBounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-4px); opacity: 1; } }
  </style>
</head>
<body>
  <div class="help-screen">
    <header class="ios-navbar">
      <button class="ios-back-btn" onclick="window.location.href='seller.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Dashboard
      </button>
      <div class="ios-navbar-identity">
        <div class="ios-navbar-avatar"><img src="../../assets/img/homesure-cat.svg" alt="" /></div>
        <div class="ios-navbar-name">Meowrie</div>
        <div class="ios-navbar-status"><span class="dot"></span>Online</div>
      </div>
      <div class="ios-navbar-spacer"></div>
    </header>

    <div class="chatbot-messages" id="chatbotMessages"></div>

    <div class="ios-input-bar">
      <textarea
        class="ios-input"
        id="chatbotInput"
        placeholder="Message"
        rows="1"
        onkeydown="ChatbotWidget.handleKeyDown(event)"
      ></textarea>
      <button class="ios-send-btn" id="chatbotSendBtn" onclick="ChatbotWidget.sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"/>
          <polyline points="5 12 12 5 19 12"/>
        </svg>
      </button>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.js"></script>
<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/session.js"></script>
<script>
  // Same guard every other seller page has (seller-dashboard.js:4) — this page never had one, so
  // it could be reached directly without signing in at all.
  const session = getSession();
  if (!session || session.role !== 'seller') window.location.href = '../../auth/signin.html';
</script>
<script src="../../assets/js/data.js"></script>
<script src="../../assets/js/chatbot-widget.js"></script>
<script>
  ChatbotWidget.initFullPage();
</script>
</body>
</html>
