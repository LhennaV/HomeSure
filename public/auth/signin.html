<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="../assets/img/image.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HomeSure – Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/auth.css" />
  <link rel="stylesheet" href="../assets/css/responsive.css" />
</head>
<body class="dark">
  <div class="auth-page">
    <div class="auth-bg-photo" id="authBgPhoto"></div>
    <div class="auth-bg-overlay"></div>
    <span class="auth-glow auth-glow-1"></span>
    <span class="auth-glow auth-glow-2"></span>

    <div class="auth-tagline">
      <h2>No hidden listings.<br><em>No unverified sellers.</em></h2>
      <p>HomeSure connects buyers with verified property owners across Sta. Maria, Bulacan.</p>
    </div>

    <div class="auth-card">
      <a class="auth-card-brand" href="../index.html">
        <img src="../assets/img/image.png" alt="HomeSure" />
        HomeSure
      </a>

      <div class="auth-form-wrap signin-wrap">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-sub">Sign in to access your HomeSure account</p>

        <div class="field-group">
          <label class="field-label">Email</label>
          <input class="field-input full" type="email" placeholder="Enter your email" />
        </div>

        <div class="field-group">
          <label class="field-label">Password</label>
          <div class="input-eye">
            <input class="field-input full" type="password" id="pw1" placeholder="Enter your password" />
            <button class="eye-btn" onclick="togglePw('pw1', this)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="field-row-end">
            <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
          </div>
        </div>

        <button class="btn-primary full" onclick="submitSignin()">Sign in</button>

        <div class="divider"><span>or</span></div>

        <button class="btn-google full" onclick="signInWithGoogle()">
          <svg width="18" height="18" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          Sign in with Google
        </button>

        <p class="auth-footer-text">
          Don't have an account?
          <a href="signup.html" class="auth-link">Sign up</a>
        </p>
      </div>
    </div>

    <footer class="auth-page-footer">
      <span>© 2026 HomeSure.site</span>
      <div class="footer-links"><a href="../terms.html">Terms</a><a href="../privacy-policy.html">Privacy</a></div>
    </footer>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/session.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/auth.js"></script>
</body>
</html>
