<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="../../assets/img/image.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HomeSure – Viewing Requests</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/seller/viewing-requests.css" />
  <link rel="stylesheet" href="../../assets/css/responsive.css" />
</head>
<body>
<div class="layout">
  <div id="hs-sidebar"></div>
  <div class="main">
    <div id="hs-topbar"></div>
    <div class="content">

      <div class="page-header">
        <div class="page-title">Viewing Requests</div>
        <div class="page-sub">Manage property viewing appointments from buyers</div>
      </div>

      <!-- Tabs -->
      <div class="tabs-wrap">
        <button class="tab-btn active" data-status="all" onclick="filterRequests('all')">
          All Requests <span class="tab-badge" id="badge-all">0</span>
        </button>
        <button class="tab-btn" data-status="pending" onclick="filterRequests('pending')">
          Pending <span class="tab-badge pending" id="badge-pending">0</span>
        </button>
        <button class="tab-btn" data-status="confirmed" onclick="filterRequests('confirmed')">
          Confirmed <span class="tab-badge confirmed" id="badge-confirmed">0</span>
        </button>
        <button class="tab-btn" data-status="counter-proposed" onclick="filterRequests('counter-proposed')">
          Counter-Proposed <span class="tab-badge counter" id="badge-counter">0</span>
        </button>
      </div>

      <!-- Requests List -->
      <div class="requests-list" id="requestsList">
        <!-- Populated by JavaScript -->
      </div>

    </div><!-- /content -->
  </div>
</div>

<!-- Response Modal -->
<div class="modal-overlay" id="responseModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeResponseModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>

    <div class="modal-title" id="modalTitle">Respond to Viewing Request</div>

    <!-- Request Details -->
    <div class="modal-section">
      <div class="modal-section-label">Request Details</div>
      <div class="request-detail-row">
        <span class="detail-label">Buyer:</span>
        <span class="detail-value" id="modalBuyer">-</span>
      </div>
      <div class="request-detail-row">
        <span class="detail-label">Property:</span>
        <span class="detail-value" id="modalProperty">-</span>
      </div>
      <div class="request-detail-row">
        <span class="detail-label">Requested Date:</span>
        <span class="detail-value" id="modalDate">-</span>
      </div>
      <div class="request-detail-row">
        <span class="detail-label">Requested Time:</span>
        <span class="detail-value" id="modalTime">-</span>
      </div>
      <div class="request-detail-row" id="buyerNotesRow" style="display:none">
        <span class="detail-label">Buyer Notes:</span>
        <span class="detail-value" id="modalBuyerNotes">-</span>
      </div>
    </div>

    <!-- Counter Proposal Section (hidden by default) -->
    <div class="modal-section" id="counterSection" style="display:none">
      <div class="modal-section-label">Propose Different Date/Time</div>
      <div class="field-row">
        <div class="modal-field">
          <label class="modal-label" for="counterDate">New Date</label>
          <input type="date" class="modal-input" id="counterDate" />
        </div>
        <div class="modal-field">
          <label class="modal-label" for="counterTime">New Time</label>
          <select class="modal-select" id="counterTime">
            <option value="">Choose time</option>
            <option value="09:00">9:00 AM</option>
            <option value="10:00">10:00 AM</option>
            <option value="11:00">11:00 AM</option>
            <option value="13:00">1:00 PM</option>
            <option value="14:00">2:00 PM</option>
            <option value="15:00">3:00 PM</option>
            <option value="16:00">4:00 PM</option>
            <option value="17:00">5:00 PM</option>
          </select>
        </div>
      </div>
      <div class="modal-field">
        <label class="modal-label" for="counterNotes">Message to Buyer</label>
        <textarea class="modal-textarea" id="counterNotes" rows="2" placeholder="Explain why you're proposing a different time..."></textarea>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="modal-actions">
      <button class="action-btn decline-btn" onclick="respondToRequest('declined')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
        </svg>
        Decline
      </button>
      <button class="action-btn counter-btn" onclick="toggleCounterSection()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        Counter-Propose
      </button>
      <button class="action-btn accept-btn" onclick="respondToRequest('confirmed')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Accept
      </button>
    </div>
  </div>
</div>

<script src="../../assets/js/fake-data.js"></script>
<script src="../../components/sidebar.js"></script>
<script src="../../components/topbar.js"></script>
<script src="../../assets/js/seller/seller-viewing-requests.js"></script>
</body>
</html>
