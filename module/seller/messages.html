<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="../../assets/img/image.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HomeSure – Messages</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/buyer/buyer-messages.css" />
  <link rel="stylesheet" href="../../assets/css/responsive.css" />
</head>
<body>
<div class="layout">
  <div id="hs-sidebar"></div>
  <div class="main">
    <div id="hs-topbar"></div>
    <div class="content">
      <div class="messages-layout">

        <!-- ── Conversation list ── -->
        <div class="conv-panel">
          <div class="conv-top">
            <div class="conv-title">Messages</div>
            <div class="conv-search-wrap">
              <span class="conv-search-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              </span>
              <input class="conv-search" id="convSearch" placeholder="Search conversations..." oninput="filterConvs()" />
            </div>
          </div>
          <div class="conv-list" id="convList"></div>
        </div>

        <!-- ── Chat area ── -->
        <div class="chat-panel" id="chatPanel">
          <div class="chat-empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <p>Select a conversation to start messaging</p>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- ── Payment Request Modal ─────────────────────────────────── -->
<div class="modal-backdrop" id="payReqModal" style="display:none;position:fixed;inset:0;z-index:900;background:rgba(0,0,0,0.65);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px;" onclick="if(event.target===this)closePayReqModal()">
  <div style="background:#253347;border:1px solid rgba(255,255,255,0.07);border-radius:18px;width:100%;max-width:420px;overflow:hidden;animation:fadeUp .22s ease both;">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;padding:20px 22px 16px;border-bottom:1px solid rgba(255,255,255,0.07);">
      <div>
        <div style="font-size:16px;font-weight:800;color:#f1f5f9;">Send Payment Request</div>
        <div style="font-size:12px;color:rgba(255,255,255,0.4);margin-top:3px;" id="prPropertyName">—</div>
      </div>
      <button onclick="closePayReqModal()" style="background:rgba(255,255,255,0.06);border:none;border-radius:8px;width:30px;height:30px;cursor:pointer;color:rgba(255,255,255,0.5);display:flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <form onsubmit="sendPaymentRequest(event)" style="padding:20px 22px;display:flex;flex-direction:column;gap:14px;">
      <div style="display:flex;flex-direction:column;gap:6px;">
        <label style="font-size:11.5px;font-weight:700;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:.05em;">Amount (₱)</label>
        <input id="prAmount" type="number" min="1" required
          style="background:#2c3d55;border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:10px 14px;color:#f1f5f9;font-family:inherit;font-size:13.5px;outline:none;width:100%;" />
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <label style="font-size:11.5px;font-weight:700;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:.05em;">Period / Month</label>
        <input id="prPeriod" type="text" placeholder="e.g. June 2026" required
          style="background:#2c3d55;border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:10px 14px;color:#f1f5f9;font-family:inherit;font-size:13.5px;outline:none;width:100%;" />
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;padding-top:8px;border-top:1px solid rgba(255,255,255,0.07);margin-top:4px;">
        <button type="button" onclick="closePayReqModal()"
          style="background:transparent;border:1.5px solid rgba(255,255,255,0.12);border-radius:10px;padding:10px 20px;color:rgba(255,255,255,0.6);font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;">
          Cancel
        </button>
        <button type="submit"
          style="background:#00c9a7;border:none;border-radius:10px;padding:10px 24px;color:#fff;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:7px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          Send Request
        </button>
      </div>
    </form>
  </div>
</div>

<script src="../../assets/js/fake-data.js"></script>
<script src="../../components/sidebar.js"></script>
<script src="../../components/topbar.js"></script>
<script src="../../assets/js/seller/seller-messages.js"></script>
</body>
</html>
